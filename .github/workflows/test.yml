name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "test (${{ matrix.os }}${{ matrix.features && format(' {0}', matrix.features) || '' }})"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: ["", "encoder"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: Test
        run: cargo test --release ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
