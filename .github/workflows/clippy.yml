name: clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  clippy:
    name: "clippy (${{ matrix.features || 'default' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "encoder"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --release ${{ matrix.features && format('--features {0}', matrix.features) || '' }} -- -D warnings
