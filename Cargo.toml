[package]
name = "lamina-ras"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
authors = ["Eira <eira@nornity.com>"]
description = "ras - as/GAS alternative. Cross-platform assembler: assembly source (.s) to relocatable object files (.o). Used by Lamina, usable standalone."
license = "Apache-2.0"
keywords = ["assembler", "assembly", "object-file", "compiler"]
categories = ["compilers", "development-tools"]
repository = "https://github.com/Project-Lamina/ras"

[[bin]]
name = "ras"
path = "src/main.rs"

[lib]
name = "ras"
path = "src/lib.rs"

[dependencies]
lamina-platform = "0.1.1"
lamina-mir = { version = "0.1.0", optional = true }
lamina-codegen = "0.1.1"
libc = "0.2"
log = "0.4"

[[test]]
name = "aarch64_oracle"
required-features = ["encoder"]

[[test]]
name = "riscv_oracle"
required-features = ["encoder"]

[[test]]
name = "riscv_labels"
required-features = ["encoder"]

[[test]]
name = "x86_oracle"
required-features = ["encoder"]

[features]
default = []
encoder = ["lamina-mir"]
