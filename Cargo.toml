[package]
name = "lamina-ras"
version = "0.2.7"
edition = "2024"
rust-version = "1.88"
authors = ["Eira <eira@nornity.com>"]
description = "ras - as/GAS alternative. Cross-platform assembler: assembly source (.s) to relocatable object files (.o). Used by Lamina, usable standalone."
license = "Apache-2.0"
keywords = ["assembler", "assembly", "object-file", "compiler"]
categories = ["compilers", "development-tools"]
repository = "https://github.com/Project-Lamina/ras"

[[bin]]
name = "ras"
path = "src/main.rs"

[lib]
name = "ras"
path = "src/lib.rs"

[dependencies]
lamina-platform = "0.2.1"
lamina-mir = { version = "0.2.1", optional = true }
lamina-codegen = { version = "0.2.1", optional = true }
log = "0.4"

# Only the Unix paths call into it: dlopen, dlsym and mmap.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
encoder = ["lamina-mir", "lamina-codegen"]
nightly = ["lamina-platform/nightly", "lamina-codegen?/nightly", "lamina-mir?/nightly"]
